name: Deploy Cloudflare Worker (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Required secrets and storage bindings
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN secret required" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID secret required" && exit 1)
          grep -q 'binding = "DB"' wrangler.toml || (echo "D1 binding DB is missing" && exit 1)
          echo "R2 is optional; artwork originals will not be archived without an R2 binding."
      - name: Run automated tests
        run: npm test
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
